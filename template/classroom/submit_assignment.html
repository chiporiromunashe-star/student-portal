{% extends 'classroom/base.html' %}
{% load bootstrap4 %}
{% block content %}
<div style="margin: 16px 0 24px 0;">
    <a href="{% url 'classroom:student_dashboard' %}" style="text-decoration: none; color: #0284c7; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;">
        &larr; Back to Dashboard
    </a>
</div>
<div class="container">
<div class="jumbotron">
  <h1>Submit Assignment</h1>
  <form enctype="multipart/form-data" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    <input type="submit" class="btn btn-primary" name="" value="Submit">
  </form>
</div>
</div>
{% endblock %}
